name: Unsigned builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }} unsigned Release
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            name: macOS universal
            artifact: ShiguangPuzzle-macOS-unsigned
            package: ShiguangPuzzle-macOS-unsigned.app.zip
          - platform: ios
            name: iOS and iPadOS
            artifact: ShiguangPuzzle-iOS-unsigned
            package: ShiguangPuzzle-iOS-unsigned.ipa
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build and package without signing
        run: bash Tools/build_unsigned.sh '${{ matrix.platform }}'

      - name: Upload unsigned package and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.package }}
            dist/${{ matrix.package }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-log-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}-build.log
          if-no-files-found: ignore
          retention-days: 7
